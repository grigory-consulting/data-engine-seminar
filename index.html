        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };
    </script>

## Was ist Data Engineering?

Data Engineering ist der Aufbau und Betrieb von Systemen, die Daten:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->erfassen, 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->speichern, 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->transformieren, 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->verlässlich für Analyse und Produkte bereitstellen. 

<div class="fragment" data-fragment-index="5">

Kernidee:

- **Aus Rohdaten werden nutzbare Datenprodukte.**

</div>
</div></script></section><section data-separator="

## Warum Data Engineering wichtig ist

Ohne Data Engineering entstehen häufig:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->inkonsistente Kennzahlen, 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->manuelle Excel-Prozesse, 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->langsame oder fehleranfällige Reports, 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->geringe Vertrauenswürdigkeit von Daten. 

<div class="fragment" data-fragment-index="5">

Mit Data Engineering:

- skalierbare und reproduzierbare Datenflüsse,
- bessere Entscheidungsqualität,
- schnellere Time-to-Insight.

</div>
</div></script></section><section data-separator="

## Architektur-Bausteine erklärt

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Ingestion:** Daten zuverlässig einsammeln (batch/stream) 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Storage:** Rohdaten + kuratierte Daten speichern 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Transformation:** fachliche Logik, Harmonisierung, Anreicherung 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Serving Layer:** Daten für BI, APIs, ML nutzbar machen 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Observability:** Monitoring, Logging, Data Quality
</div></script></section><section data-separator="

## Batch vs. Streaming in der Plattform

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Batch:** periodische Verarbeitung, robust und planbar 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Streaming:** ereignisnahe Verarbeitung, niedrige Latenz 

<div class="fragment" data-fragment-index="3">

Praxis:

- viele Plattformen nutzen hybride Ansätze,
- Wahl hängt von Business-Anforderung an Datenfrische ab.

</div>

| Artefakte | Pipelines, Modelle, Datenprodukte | Features, Experimente, Modelle |
| Erfolgskriterium | Stabilität, Qualität, Skalierung | Modellgüte, Business-Impact |

1. &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Erst Datenmodell klären, dann bauen. 
1. &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Pipeline-Tests und Datenqualitätschecks früh einbauen. 
1. &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Ownership für Tabellen/Produkte definieren. 
1. &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Monitoring/Latenz/Fehlerquoten transparent machen. 
1. &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Dokumentation als Teil der Lieferung behandeln.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Data Engineering schafft die technische Grundlage für datengetriebene Entscheidungen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Data Engineers bauen und betreiben Datenplattformen als verlässliche Produkte. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Gute Plattformarchitektur verbindet Quellen, Transformation und Konsum klar. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Data Engineering und Data Science sind komplementär und wirken am stärksten gemeinsam.

Ein gutes Datenmodell sorgt für:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->konsistente Daten, 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->klare Geschäftslogik, 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->wartbare Systeme, 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->bessere Query-Performance.

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->widersprüchlichen Daten, 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->teuren Workarounds in Abfragen.

## Konzeptioneller Entwurf

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Aufbau eines semantischen Modells der Fachdomäne, also eines Informationsmodells auf höchster Abstraktionsebene. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Ohne Orientierung an einer konkreten Datenbanksoftware oder einem bestimmten Datenmodell. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Beschreibung der Informationsobjekte bzw. Fachbegriffe und der Beziehungen zwischen ihnen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Beschreibung von Integritätsanforderungen: zulässige Datenwerte und zulässige Beziehungen zwischen Daten.
</div></script></section><section data-separator="

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Es dient dazu, die **Semantik der Fachdomäne** auf der **höchsten Abstraktionsebene** darzustellen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Im Fokus stehen Entitäten und die Beziehungen zwischen Entitäten.

## Logischer Entwurf

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Erstellung eines Datenbankschemas auf Basis eines konkreten Datenmodells, z. B. des relationalen Datenmodells. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Für das relationale Modell ist das logische Modell eine Menge von Relationsschemata, meist mit Primärschlüsseln sowie Beziehungen über Fremdschlüssel. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->In der Phase des logischen Entwurfs wird die Spezifik des gewählten Datenmodells berücksichtigt, die Spezifik eines konkreten DBMS kann jedoch noch unberücksichtigt bleiben.
</div></script></section><section data-separator="

## Physischer Entwurf

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Umsetzung des Datenbankschemas für eine **konkrete** DBMS-Plattform. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Berücksichtigt die Spezifika des gewählten Systems, zum Beispiel: 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Namenskonventionen und Namensgrenzen für Datenbankobjekte. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Unterstützte Datentypen und deren systemabhängige Eigenschaften.
</div></script></section><section data-separator="

## Physischer Entwurf

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Auswahl von Speicher- und Zugriffsverfahren. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Aufteilung der Datenbank auf Dateien, Tablespaces und Geräte. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Verteilung und Optimierung von Datenzugriffspfaden. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Erstellung und Feinabstimmung von Indizes. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Kurz: alles, was an das konkrete DBMS gebunden ist.
</div></script></section><section data-separator="

## Physischer Entwurf

```sql
CREATE TABLE faculty (
 id int(11) unsigned NOT NULL AUTO_INCREMENT,
 name varchar(255) DEFAULT NULL,
 PRIMARY KEY (id)
) ENGINE=InnoDB DEFAULT CHARSET=utf8;

CREATE TABLE `group` (
 id int(11) unsigned NOT NULL AUTO_INCREMENT,
 faculty_id int(10) unsigned DEFAULT NULL,
 name varchar(255) DEFAULT NULL,
 PRIMARY KEY (id),
 KEY faculty_id (faculty_id),
 CONSTRAINT faculty_id FOREIGN KEY (faculty_id) REFERENCES faculty (id) ON DELETE SET NULL ON UPDATE SET NULL
) ENGINE=InnoDB DEFAULT CHARSET=utf8;

CREATE TABLE student (
 id int(11) unsigned NOT NULL AUTO_INCREMENT,
 first_name varchar(255) DEFAULT NULL,
 second_name varchar(255) DEFAULT NULL,
 last_name varchar(255) DEFAULT NULL,
 group_id int(10) unsigned DEFAULT NULL,
 PRIMARY KEY (id),
 KEY group_id (group_id),
 CONSTRAINT group_id FOREIGN KEY (group_id) REFERENCES group (id) ON DELETE SET NULL ON UPDATE SET NULL
) ENGINE=InnoDB DEFAULT CHARSET=utf8;

## Was bedeutet Normalisierung?

Normalisierung ist ein Entwurfsansatz für relationale Datenbanken mit dem Ziel:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Redundanzen zu reduzieren, 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Inkonsistenzen zu vermeiden, 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Update-/Insert-/Delete-Anomalien zu verhindern, 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Datenmodelle klar und wartbar zu strukturieren.
</div></script></section><section data-separator="
?

" data-separator-vertical="

## Warum überhaupt normalisieren?

Typische Probleme ohne Normalisierung:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Update-Anomalie**: gleiche Information an mehreren Stellen 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Insert-Anomalie**: neue Fakten lassen sich nicht sauber einfügen 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Delete-Anomalie**: beim Löschen geht ungewollt Zusatzwissen verloren
</div></script></section><section data-separator="

## Warum überhaupt normalisieren?

Nutzen:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->konsistentere Daten, 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->klarere Verantwortlichkeiten, 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->einfachere Pflege und Änderung.
</div></script></section><section data-separator="

## Grundkonzepte: Schlüssel & Abhängigkeiten

Für Normalisierung zentral:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Schlüssel / Schlüsselkandidaten** 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**funktionale Abhängigkeit**: A → B 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**voll funktional abhängig** (wichtig für 2NF) 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**transitiv abhängig** (wichtig für 3NF)
</div></script></section><section data-separator="

## Häufiger Einwand: „Nur gesunder Menschenverstand?“

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Einwand: „Normalisierung ist nur gesunder Menschenverstand; erfahrene Profis entwerfen ohnehin intuitiv ein sauberes Schema.“ 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Einordnung: Genau diese Denkregeln werden durch die Theorie der Abhängigkeiten explizit gemacht. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Kerngedanke: Normalisierungsprinzipien sind **formalisierter** gesunder Menschenverstand. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Nutzen der Formalisierung: Entwürfe werden nachvollziehbar, diskutierbar und systematisch prüfbar.
</div></script></section><section data-separator="

Normalisierung konkurriert teilweise mit:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Normalisierung erhöht Datenqualität und Wartbarkeit. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->1NF–3NF decken den Großteil praktischer Modellierungsprobleme ab. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->BCNF/4NF/5NF sind wichtig für spezielle, komplexe Abhängigkeiten. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Gute Datenmodelle balancieren Konsistenz, Verständlichkeit und Performance.

## Was ist NoSQL?

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Sammelbegriff für Datenbanksysteme, die Daten nicht primär relational organisieren. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Typische Ziele sind flexible Modellierung, horizontale Skalierung und verteilte Verarbeitung. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Viele Systeme sind schemaflexibler als klassische relationale Datenbanken. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->NoSQL ersetzt SQL nicht pauschal, sondern ergänzt es für andere Problemklassen.
</div></script></section><section data-separator="

## NoSQL-Typen

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Dokumentenorientiert**: MongoDB, Couchbase 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Key-Value**: Redis, DynamoDB 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Wide-Column**: Cassandra, HBase 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Graph**: Neo4j, JanusGraph 

<div class="fragment" data-fragment-index="5">

Praxisregel:

- Zuerst Datenzugriff und Änderungsverhalten verstehen, erst danach den Datenbanktyp auswählen.

</div>
</div></script></section><section data-separator="

## Warum MongoDB?

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->BSON-Dokumente bilden Anwendungsobjekte sehr direkt ab. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Verschachtelte Objekte und Arrays lassen sich natürlich modellieren. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Das Schema kann mit dem Produkt wachsen, ohne bei jeder Änderung Migrationen zu erzwingen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Shell, Treiber und Ökosystem machen MongoDB für Teams pragmatisch nutzbar.
</div></script></section><section data-separator="

## Datenmodell in MongoDB

Kernbegriffe:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Database**: fachlicher Container 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Collection**: Gruppe ähnlicher Dokumente 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Document**: zusammengehörige Daten in einer Einheit 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Field**: einzelnes Attribut im Dokument 

<div class="fragment" data-fragment-index="5">

Dokumente können:

- verschachtelte Objekte enthalten,
- Arrays enthalten,
- je nach Fall leicht unterschiedliche Felder besitzen.

</div>
</div></script></section><section data-separator="

## Embedded vs Referencing

**Embedded (einbetten)**

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->sinnvoll, wenn Daten gemeinsam gelesen und gemeinsam gespeichert werden 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->reduziert zusätzliche Abfragen 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->vermeidet technische Joins in vielen Alltagsszenarien 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->wird problematisch, wenn Teilobjekte stark wachsen oder unabhängig weiterverwendet werden 

<div class="fragment" data-fragment-index="5">

**Referencing (referenzieren)**

- sinnvoll, wenn Entitäten mehrfach genutzt werden
- reduziert Redundanz und vereinfacht zentrale Änderungen
- benötigt oft zusätzliche Abfragen oder `$lookup`
- passt gut zu Kursen, Produkten, Rollen oder Stammdaten

</div>

## CRUD in MongoDB

```javascript
// C: Create
db.students.insertOne({
  matrikelnummer: "S-2026-002",
  name: { vorname: "Lukas", nachname: "Weber" },
  gruppe: "INF-21A",
  tags: ["java"],
  kurs_ids: ["DB-101"],
  credits: 72
});

// R: Read
db.students.find(
  { gruppe: "INF-21A" },
  { _id: 0, matrikelnummer: 1, "name.vorname": 1, "name.nachname": 1, credits: 1 }
);

// U: Update
db.students.updateOne(
  { matrikelnummer: "S-2026-002" },
  {
    $set: { credits: 78 },
    $addToSet: { tags: "mongodb" }
  }
);

// D: Delete
db.students.deleteOne({ matrikelnummer: "S-2026-002" });
```
</div></script></section><section data-separator="

## Abfragen und Filter

```javascript
// Vergleichsoperatoren
db.students.find({ credits: { $gte: 60, $lt: 90 } });

// Kombination von Bedingungen
db.students.find({
  gruppe: "INF-21A",
  tags: "python"
});

// Sortierung, Projektion und Limit
db.students.find(
  { gruppe: "INF-21A" },
  { _id: 0, matrikelnummer: 1, "name.vorname": 1, credits: 1 }
).sort({ credits: -1 }).limit(5);
```

## Aggregation Pipeline

```javascript
db.students.aggregate([
  {
    $match: {
      gruppe: { $in: ["INF-21A", "INF-21B"] }
    }
  },
  {
    $group: {
      _id: "$gruppe",
      durchschnittliche_credits: { $avg: "$credits" },
      anzahl_studierende: { $sum: 1 }
    }
  },
  {
    $sort: {
      durchschnittliche_credits: -1
    }
  }
]);
```
</div></script></section><section data-separator="

## Join-ähnliche Auswertung mit `$lookup`

```javascript
db.students.aggregate([
  { $match: { matrikelnummer: "S-2026-001" } },
  {
    $lookup: {
      from: "kurse",
      localField: "kurs_ids",
      foreignField: "kurs_id",
      as: "kurse"
    }
  },
  {
    $project: {
      _id: 0,
      matrikelnummer: 1,
      "name.vorname": 1,
      "name.nachname": 1,
      "kurse.titel": 1,
      "kurse.ects": 1
    }
  }
]);
```

## Indexe in MongoDB

```javascript
// Eindeutige Identifikation
db.students.createIndex({ matrikelnummer: 1 }, { unique: true });

// Häufige Liste: Gruppe plus Sortierung nach Credits
db.students.createIndex({ gruppe: 1, credits: -1 });

// Referenzsammlung
db.kurse.createIndex({ kurs_id: 1 }, { unique: true });
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Indexe beschleunigen Lesezugriffe, kosten aber Speicher und verlangsamen Schreiboperationen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Gute Indexe leiten sich aus echten Query-Mustern ab, nicht aus Bauchgefühl.
</div></script></section><section data-separator="

db.createCollection("students", {
  validator: {
    $jsonSchema: {
      bsonType: "object",
      required: ["matrikelnummer", "name", "gruppe"],
      properties: {
        matrikelnummer: { bsonType: "string" },
        name: {
          bsonType: "object",
          required: ["vorname", "nachname"],
          properties: {
            vorname: { bsonType: "string" },
            nachname: { bsonType: "string" }
          }
        },
        gruppe: { bsonType: "string" },
        tags: {
          bsonType: "array",
          items: { bsonType: "string" }
        },
        kurs_ids: {
          bsonType: "array",
          items: { bsonType: "string" }
        },
        credits: { bsonType: "int", minimum: 0 }
      }
    }
  }
});
```
</div></script></section><section data-separator="

## Konsistenz und Transaktionen

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->MongoDB unterstützt Transaktionen über mehrere Dokumente und Collections. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Gute Modellierung versucht trotzdem, Multi-Document-Transaktionen zur Ausnahme zu machen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Je mehr Fachlogik mit verteilten Änderungen, desto teurer wird das System im Betrieb.
</div></script></section><section data-separator="

## SQL vs MongoDB

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**SQL** ist stark bei stabilen, stark verknüpften Domänen mit vielen Joins. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**MongoDB** ist stark bei dokumentnahen, hierarchischen und sich entwickelnden Datenstrukturen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->SQL denkt stärker in Normalisierung und Beziehungen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->MongoDB denkt stärker in Zugriffsmustern und fachlich zusammengehörigen Dokumenten.
</div></script></section><section data-separator="

## Gute Einsatzszenarien für MongoDB

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Produkt- und Content-Kataloge mit variablen Attributen 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Event-, Telemetrie- und Log-Daten 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->API-Backends mit JSON-lastigen Nutzdaten 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Anwendungen, in denen sich das Schema noch sichtbar weiterentwickelt
</div></script></section><section data-separator="

## Wann relationale Systeme oft besser passen

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Viele komplexe Joins über stabile, stark verknüpfte Fachdomänen 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Harte Integritätsregeln über zahlreiche Entitäten hinweg 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Berichte, die stark von relationalen Auswertungen und klassischen BI-Mustern leben
</div></script></section><section data-separator="

## Zum Schluss

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->MongoDB ist besonders stark, wenn Daten fachlich natürlich als Dokumente auftreten. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Gute MongoDB-Modellierung orientiert sich an Lese- und Schreibmustern, nicht zuerst an Normalformen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Flexibilität ist kein Freifahrtschein: Validierung, Indexe und Konsistenzentscheidungen bleiben Pflicht. 

<div class="fragment" data-fragment-index="4">

> [!tip]
> Entscheidungsregel: Wenn ein fachlicher Vorgang meist auf ein Dokument oder wenige eng zusammengehörige Dokumente passt, ist MongoDB oft sehr stark.

</div>

## Warum ein Data Warehouse?

Ein DWH adressiert typische Analyseprobleme:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Daten liegen verteilt in mehreren Quellsystemen, 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->operative Systeme enthalten oft zu wenig Historie, 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->analytische Fragestellungen benötigen konsolidierte, vergleichbare Daten. 

<div class="fragment" data-fragment-index="4">

Kernziel:

- **verlässliche Entscheidungsgrundlage** für Reporting, BI und Analyse.

</div>
</div></script></section><section data-separator="

## OLTP: operative Transaktionssysteme

**OLTP (Online Transaction Processing)** ist auf operative Prozesse optimiert.

Typisch:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->viele gleichzeitige Nutzer, 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->kurze, einfache Anfragen, 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->sehr niedrige Latenz (ms bis sub-ms), 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->häufige Inserts/Updates/Deletes.
</div></script></section><section data-separator="
?
---

" data-separator-vertical="

## OLAP: analytische Systeme

**OLAP (Online Analytical Processing)** ist auf Analyse optimiert.

Typisch:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->komplexe, ad-hoc Abfragen, 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->historische Daten über längere Zeiträume, 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Aggregationen, Trends, Vergleichsanalysen, 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->weniger Requests, aber deutlich schwerere Queries.
</div></script></section><section data-separator="

## OLAP: analytische Systeme

| Dimension | OLTP | OLAP |
|---|---|---|
| Ziel | Operative Prozesse | Analyse/Entscheidungen |
| Daten | Aktuelle Detaildaten | Historie + Aggregationen |
| Abfragen | Vordefiniert, kurz | Ad-hoc, komplex |
| Änderungen | Kontinuierlich | Periodische Ladungen / Refresh |
| Modellierung | Stark normalisiert | Analysefreundlich  |
</div></script></section><section data-separator="

1. &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Primary Data Layer** (Raw/Staging) 
1. &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Core Data Layer** (zentraler Integrationskern) 
1. &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Data Mart Layer** (fachliche Ausspielung für Konsumenten)
</div></script></section><section data-separator="

## Primary Data Layer (Raw/Staging)

Aufgaben:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Aufnahme von Quellsystemdaten in Rohform, 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Historisierung von Änderungen, 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Entkopplung von Quelltechnologien und Folgeschichten. 

<div class="fragment" data-fragment-index="4">

Nutzen:

- Nachvollziehbarkeit, Reproduzierbarkeit, robuste Pipeline-Grundlage.

</div>
</div></script></section><section data-separator="

## Core Data Layer

Aufgaben:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Konsolidierung über mehrere Quellen, 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Vereinheitlichung von Schlüsseln und Strukturen, 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Datenqualitätsregeln und zentrale Transformationen. 

<div class="fragment" data-fragment-index="4">

Nutzen:

- Consumer werden von Quelllogik und Mapping-Komplexität abstrahiert.

</div>

## Data Mart Layer (Konsum-Schicht)

Aufgaben:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Aufbereitung für konkrete Analyse- und Reportingzwecke, 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->themenspezifische Sichten pro Fachbereich, 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->optimierte Strukturen für BI-Tools. 

<div class="fragment" data-fragment-index="4">

Nutzen:

- schnellere Time-to-Insight,
- klare, zielgruppengerechte Datenprodukte.

</div>
</div></script></section><section data-separator="

## Inmon-Ansatz (Top-down)

Charakteristik:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->zentraler Unternehmensblick zuerst, 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->starke Modellierung des Core-Layers, 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Data Marts als nachgelagerte Ableitungen. 

<div class="fragment" data-fragment-index="4">

Vorteile:

- hohe Konsistenz,
- einheitliche KPI-Definitionen,
- gute Skalierbarkeit bei vielen Quellen.

</div>
</div></script></section><section data-separator="

## Inmon-Ansatz (Top-down)

Nachteile:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->höherer Initialaufwand, 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->längere Vorlaufzeit bis zu sichtbaren Ergebnissen.
</div></script></section><section data-separator="

## Kimball-Ansatz (Bottom-up)

Charakteristik:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Start mit konkreten Fachanforderungen/Reports, 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Data Marts im Vordergrund, 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->schrittweise Ausbau. 

<div class="fragment" data-fragment-index="4">

Vorteile:

- schneller Business-Impact,
- pragmatischer Einstieg,
- gute Iterierbarkeit.

</div>

## Inmon vs. Kimball

Wann eher Inmon?

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->hohe Governance-Anforderungen, 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->viele Quellen und Domänen, 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->langfristiger Enterprise-Fokus. 

<div class="fragment" data-fragment-index="4">

Wann eher Kimball?

- schneller Nutzen gefordert,
- klar abgegrenzte Fach-Use-Cases,
- begrenzte Startkapazitäten.

## Data Lake

Ein **Data Lake** speichert heterogene Daten oft zunächst roh:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->strukturierte Daten, 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->semi-strukturierte Daten (z. B. JSON, Logs), 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->unstrukturierte Daten (z. B. Bild/Video/Audio, Dokumente). 

<div class="fragment" data-fragment-index="4">

Typisch:

- schema-on-read,
- hohe Flexibilität bei neuen Datentypen,
- oft günstige, skalierbare Objekt- oder Filesystem-Storage-Basis.

</div>
</div></script></section><section data-separator="

## Data Lake: Stärken und Grenzen

Stärken:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->schnelle Aufnahme neuer Datenquellen, 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->gute Skalierbarkeit, 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->niedrige Einstiegskosten. 

<div class="fragment" data-fragment-index="4">

Grenzen ohne Governance:

- unklare Semantik,
- uneinheitliche Qualität,
- hoher Aufbereitungsaufwand für BI.

</div>
</div></script></section><section data-separator="

## Data Swamp vermeiden

**Data Swamp** = „Daten sind da, aber kaum nutzbar“.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->fehlende Qualitätskontrollen, 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->schwache Metadatenpflege, 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->keine klaren Ownerships, 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->unzureichende Katalogisierung und Lineage. 

<div class="fragment" data-fragment-index="5">

Gegenmaßnahmen:

- verbindliche Ingestion-Standards,
- Data Catalog + Lineage,
- Qualitätsregeln und Zugriffskonzepte.

</div>
</div></script></section><section data-separator="

## Warum Lakehouse?

Lakehouse entstand aus den Grenzen von reinem DWH und reinem Data Lake:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->DWH: starke Governance, aber oft teurer und schema-strenger, 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Data Lake: flexibel und günstig, aber häufig ohne ausreichende Transaktions-/Qualitätsgarantien.
</div></script></section><section data-separator="

## Warum Lakehouse?

**Lakehouse** kombiniert beides:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->offene, skalierbare Storage-Schicht, 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->transaktionale/verlässliche Tabellensemantik, 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->einheitlicher Datenzugriff für BI, Analytics und ML.
</div></script></section><section data-separator="

## Lakehouse: zentrale Bausteine

1. &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Storage Layer** (z. B. S3/ADLS/GCS/HDFS)

## Was ist S3?

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Simple Storage Service 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Objektspeicher: Daten als **Objekte** in **Buckets** (nicht „File System“) 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Zugriff über APIs/SDKs/CLI/Console (HTTP/REST) 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Hohe Haltbarkeit (Design-Ziel: 11×9) + (je nach Klasse) Multi-AZ-Resilienz (Availability Zones) 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Typische Rolle: „Separation of Storage & Compute“ (Apps, Analytics, Backup/Archive)
</div></script></section><section data-separator="

## Datenmodell & Regionen

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Bucket**: Container, globaler Namespace (Name muss eindeutig sein, je Partition) 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Objekt**: Daten + Key (Name) + Metadaten; Keys sind „Pfad-artig“, aber keine echten Ordner 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Region**: bestimmt Datenresidenz, Latenz, Kosten (u.a. Transfer/Request) 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Naming: DNS-kompatibel; nutze eindeutige Suffixe (z.B. GUID/Projekt/Account) 

<div class="fragment" data-fragment-index="5">

```bash
# Beispiel:
export BUCKET="myproj-data-$(uuidgen | tr '[:upper:]' '[:lower:]')"
# myproj-data-3f2c9b6d-8d74-4d4f-8f1a-6f9a2bb1c1e7

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Lifecycle**: automatisierte Transitions/Expiration 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Replication**: Compliance, Latenz, Disaster Recovery; Planung inkl. Kosten/Policies

## Spark vs. Hadoop (MapReduce)

| | Spark | Hadoop MapReduce |
|---|---|---|
| **Verarbeitung** | In-Memory / Festplatte | Festplatte |
| **Geschwindigkeit** | In-Memory bis zu 100-mal schneller als Hadoop | MapReduce liest und schreibt immer von der Festplatte, daher nicht so schnell |
| **Einsetzbarkeit** | Batch, Streaming, Machine Learning und Graphverarbeitung | nur Batchverarbeitung |
| **Real-Time-Fähigkeit** | ja, bis zu Millionen Einträge pro Sekunde | nein |
| **Robustheit** | Fehlertoleranz vorhanden, Anwendung muss bei Fehlern nicht zwingend neu gestartet werden | Fehlertoleranz vorhanden, Anwendung muss bei Fehlern nicht zwingend neu gestartet werden |
| **Sicherheit** | noch Verbesserungspotenzial im Vergleich zu Hadoop | bietet mehr in Bezug auf Sicherheit |
</div></script></section><section data-separator="
